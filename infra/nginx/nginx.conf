worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/graphql-response+json;

  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=200m inactive=7d use_temp_path=off;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 80;
    include /etc/nginx/tls/*.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    set $express http://ecommerce-express:4000;
    set $next http://ecommerce-next:3000;
    set $nuxt http://ecommerce-nuxt:3000;
    set $fastapi http://ecommerce-fastapi:8000;
    set $rust http://ecommerce-rust:8080;

    location /api/v1/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $express;
    }
    location /api/docs {
      proxy_pass $express;
    }
    location /graphql {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $express;
    }
    location /webhook/ {
      proxy_pass $express;
    }
    location /socket.io/ {
      proxy_read_timeout 1h;
      proxy_pass $express;
    }
    location /ai/ {
      limit_req zone=api burst=20 nodelay;
      rewrite ^/ai/(.*)$ /$1 break;
      proxy_pass $fastapi;
    }
    location /rs/ {
      limit_req zone=api burst=40 nodelay;
      rewrite ^/rs/(.*)$ /$1 break;
      proxy_pass $rust;
    }

    location ~ ^/(en/)?(cms|landing|blog|events|pwa|config)(/|$) {
      proxy_pass $nuxt;
    }
    location /_nuxt/ {
      proxy_cache static;
      proxy_cache_valid 200 7d;
      proxy_pass $nuxt;
    }
    location /_next/static/ {
      proxy_cache static;
      proxy_cache_valid 200 7d;
      proxy_pass $next;
    }
    location / {
      proxy_pass $next;
    }

    location = /gateway/health {
      access_log off;
      return 200 "ok";
    }
  }
}
